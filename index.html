<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f4f3ef;--bg3:#eceae4;
  --tx:#141412;--tx2:#72706a;
  --bd:rgba(0,0,0,0.10);--bd2:rgba(0,0,0,0.20);
  --r:10px;--rl:14px;
  --font:'DM Sans',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
  --fs-xs:clamp(11px,1.2vw,13px);
  --fs-sm:clamp(13px,1.4vw,15px);
  --fs-base:clamp(14px,1.55vw,16px);
  --fs-lg:clamp(18px,2.2vw,22px);
  --fs-xl:clamp(22px,3vw,28px);
  --fs-2xl:clamp(26px,3.5vw,34px);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1a18;--bg2:#222220;--bg3:#2a2a27;
    --tx:#f2f0e8;--tx2:#9a9890;
    --bd:rgba(255,255,255,0.09);--bd2:rgba(255,255,255,0.17);
  }
}
@media(min-width:1600px){
  html{font-size:18px}
  :root{
    --fs-xs:13px;--fs-sm:15px;--fs-base:17px;
    --fs-lg:22px;--fs-xl:28px;--fs-2xl:34px;
  }
  .page{max-width:1320px}
}
@media(min-width:2000px){
  html{font-size:20px}
  :root{
    --fs-xs:14px;--fs-sm:16px;--fs-base:18px;
    --fs-lg:24px;--fs-xl:30px;--fs-2xl:38px;
  }
  .page{max-width:1480px}
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font);font-size:var(--fs-base);line-height:1.6;background:var(--bg3);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}
.page{max-width:1120px;margin:0 auto;padding:clamp(1.25rem,3vw,2.5rem) clamp(1rem,4vw,2rem) 5rem}
.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:clamp(1.25rem,2.5vw,2rem);flex-wrap:wrap;gap:12px}
.header h1{font-size:var(--fs-xl);font-weight:700;letter-spacing:-0.02em;line-height:1.2;display:flex;align-items:center;gap:12px}
.header h1 span{font-weight:400;color:var(--tx2);font-size:var(--fs-lg)}
.header .sub{font-size:var(--fs-sm);color:var(--tx2);margin-top:4px}

/* GoD skull logo mark */
.god-logo{flex-shrink:0}
.god-wordmark{letter-spacing:0.02em}
.god-wordmark-sub{font-weight:400;color:var(--tx2);font-size:var(--fs-base);letter-spacing:0.05em;margin-left:2px}
.header-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.refresh-btn{font-size:var(--fs-sm);font-family:var(--font);font-weight:500;padding:8px 18px;border-radius:var(--r);border:1px solid var(--bd2);background:var(--bg);color:var(--tx2);cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:background .15s,color .15s}
.refresh-btn:hover{background:var(--bg2);color:var(--tx)}
.auto-badge{font-size:var(--fs-xs);font-family:var(--mono);padding:5px 10px;border-radius:20px;background:var(--bg2);color:var(--tx2);border:1px solid var(--bd);white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background .15s}
.auto-badge:hover{background:var(--bg);color:var(--tx)}
.auto-badge.live{background:#EAF3DE;color:#2d5a0e;border-color:rgba(45,90,14,0.2)}
.auto-badge.live:hover{background:#d5ecc4}
.status-bar{display:flex;align-items:center;gap:10px;font-size:var(--fs-sm);color:var(--tx2);margin-bottom:clamp(1rem,2vw,1.5rem);padding:10px 16px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r)}
.version-tag{margin-left:auto;font-family:var(--mono);font-size:var(--fs-xs);color:var(--tx2);opacity:.75;white-space:nowrap}
.version-tag-btn{cursor:pointer;text-decoration:underline;text-decoration-color:transparent;transition:text-decoration-color .15s,opacity .15s}
.version-tag-btn:hover{opacity:1;text-decoration-color:var(--tx2)}
.changelog-backdrop{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;padding:clamp(1rem,4vw,2rem)}
.changelog-backdrop.hidden{display:none}
.changelog-modal{background:var(--bg);border:1px solid var(--bd2);border-radius:var(--rl);width:min(560px,100%);max-height:min(80vh,720px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.35)}
.changelog-header{display:flex;align-items:center;justify-content:space-between;padding:clamp(16px,2vw,22px);border-bottom:1px solid var(--bd);flex-shrink:0}
.changelog-header h2{font-size:var(--fs-lg);font-weight:600;letter-spacing:-0.01em}
.changelog-close{background:none;border:none;font-size:24px;line-height:1;color:var(--tx2);cursor:pointer;padding:4px 8px;border-radius:var(--r);font-family:var(--font)}
.changelog-close:hover{background:var(--bg2);color:var(--tx)}
.changelog-body{overflow-y:auto;padding:clamp(16px,2vw,22px);-webkit-overflow-scrolling:touch}
.changelog-entry{margin-bottom:clamp(18px,2.5vw,28px)}
.changelog-entry:last-child{margin-bottom:0;padding-bottom:0}
.changelog-version{font-size:var(--fs-base);font-weight:600;margin-bottom:4px}
.changelog-date{font-size:var(--fs-xs);color:var(--tx2);margin-bottom:10px}
.changelog-type{font-size:var(--fs-xs);font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:0.06em;margin:10px 0 6px}
.changelog-list{margin:0 0 0 1.1em;padding:0}
.changelog-list li{font-size:var(--fs-sm);color:var(--tx);margin-bottom:5px;line-height:1.5}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.tabs{display:flex;gap:6px;margin-bottom:clamp(1rem,2vw,1.5rem);flex-wrap:wrap}
.tab{font-size:var(--fs-sm);font-family:var(--font);font-weight:500;padding:8px 20px;border-radius:var(--r);border:1px solid var(--bd);background:transparent;color:var(--tx2);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.tab.active{background:var(--bg);color:var(--tx);border-color:var(--bd2)}
.tab:hover:not(.active){background:var(--bg2);color:var(--tx)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(130px,18vw,180px),1fr));gap:clamp(8px,1.2vw,14px);margin-bottom:clamp(10px,1.5vw,16px)}
.metric{background:var(--bg);border-radius:var(--r);padding:clamp(14px,2vw,20px) clamp(14px,2vw,22px);border:1px solid var(--bd)}
.metric .label{font-size:var(--fs-xs);color:var(--tx2);margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em}
.metric .val{font-size:var(--fs-2xl);font-weight:600;letter-spacing:-0.02em;line-height:1.1}
.metric .sub{font-size:var(--fs-xs);color:var(--tx2);margin-top:4px}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.5vw,16px);margin-bottom:clamp(10px,1.5vw,16px)}
@media(max-width:640px){.charts-row{grid-template-columns:1fr}}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:var(--rl);padding:clamp(14px,2vw,22px);margin-bottom:clamp(10px,1.5vw,14px)}
.card h3{font-size:var(--fs-sm);font-weight:600;color:var(--tx2);margin-bottom:clamp(12px,1.5vw,18px);letter-spacing:0.01em}
.ec-chart{width:100%}
.filter-row{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.filter-row input{font-size:var(--fs-sm);font-family:var(--font);padding:9px 14px;border-radius:var(--r);border:1px solid var(--bd2);background:var(--bg2);color:var(--tx);width:clamp(160px,25vw,240px);outline:none;transition:border-color .15s}
.filter-row input:focus{border-color:#185FA5}
.filter-row input::placeholder{color:var(--tx2)}
.filter-hint{font-size:var(--fs-xs);color:var(--tx2)}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.player-table{width:100%;border-collapse:collapse;font-size:var(--fs-sm);table-layout:fixed}
.player-table th{text-align:left;padding:10px 12px;color:var(--tx2);border-bottom:1px solid var(--bd);font-weight:600;font-size:var(--fs-xs);white-space:nowrap;text-transform:uppercase;letter-spacing:0.05em}
.player-table td{padding:10px 12px;border-bottom:1px solid var(--bd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-table tr:last-child td{border-bottom:none}
.player-table tbody tr:hover td{background:var(--bg2)}
.player-table tbody tr.clickable{cursor:pointer}
@media(min-width:768px){
  .player-table.hist-table{table-layout:auto}
  .player-table.hist-table th.hist-col-name,
  .player-table.hist-table td.hist-col-name{
    min-width:clamp(140px,14vw,240px);
    white-space:normal;
    overflow:visible;
    text-overflow:unset;
  }
}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;font-size:var(--fs-xs);font-weight:700;font-family:var(--mono)}
.rank-1{background:#FAC775;color:#412402}.rank-2{background:#D3D1C7;color:#2C2C2A}.rank-3{background:#F5C4B3;color:#4A1B0C}.rank-other{background:var(--bg2);color:var(--tx2)}
.diff-badge{font-size:var(--fs-xs);padding:3px 9px;border-radius:10px;font-weight:600;font-family:var(--mono)}
.above{background:#EAF3DE;color:#2d5a0e}.below{background:#FCEBEB;color:#922020}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bar-label{font-size:var(--fs-xs);color:var(--tx2);width:140px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.bar-track{flex:1;background:var(--bg2);border-radius:4px;height:14px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .4s}
.bar-val{font-size:var(--fs-xs);color:var(--tx2);width:56px;text-align:right;flex-shrink:0;font-family:var(--mono)}
.hidden{display:none}
.contest-notice{font-size:var(--fs-sm);color:var(--tx2);padding:12px 16px;background:var(--bg2);border-radius:var(--r);margin-bottom:clamp(1rem,2vw,1.5rem);border-left:3px solid #EF9F27}
.contest-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.5vw,16px)}
@media(max-width:700px){.contest-grid{grid-template-columns:1fr}}
.contest-card{background:var(--bg);border:1px solid var(--bd);border-radius:var(--rl);overflow:hidden}
.contest-card-header{padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.contest-card-header .title{font-size:var(--fs-sm);font-weight:600;color:var(--tx)}
.contest-card-header .badge{font-size:var(--fs-xs);padding:3px 10px;border-radius:10px;font-weight:600}
.badge-top{background:#EAF3DE;color:#2d5a0e}
.badge-bot{background:#FCEBEB;color:#922020}
.badge-epic{background:#EEEDFE;color:#3C3489}
.contest-table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.contest-table th{text-align:left;padding:8px 14px;color:var(--tx2);font-weight:600;font-size:var(--fs-xs);border-bottom:1px solid var(--bd);text-transform:uppercase;letter-spacing:0.05em}
.contest-table td{padding:9px 14px;border-bottom:1px solid var(--bd);color:var(--tx)}
.contest-table tr:last-child td{border-bottom:none}
.contest-table tbody tr:hover td{background:var(--bg2)}
.contest-table tbody tr[onclick]{cursor:pointer}

/* Mobile leaderboard — hide less important columns on small screens */
@media(max-width:600px){
  .lb-col-epic{display:none}
  .lb-col-bar{display:none}
  .lb-col-rel{display:none}
  .player-table td,.player-table th{padding:10px 8px}
  .player-table{table-layout:auto}
  /* Make name column not truncate */
  .lb-col-name{max-width:none;white-space:normal;word-break:break-word}
}
@media(max-width:400px){
  .lb-col-diff{display:none}
}

/* ── Mobile bottom nav ── */
@media(max-width:680px){
  .tabs{ display:none }
  .page{ padding-bottom:6rem }
  body{ padding-bottom:env(safe-area-inset-bottom) }
}
@media(min-width:681px){
.global-search-icon{
  position:absolute;
  left:11px;top:50%;transform:translateY(-50%);
  color:var(--tx2);font-size:15px;pointer-events:none;
}
.global-search-input{
  font-size:var(--fs-sm);font-family:var(--font);
  padding:8px 14px 8px 34px;
  border-radius:var(--r);
  border:1px solid var(--bd2);
  background:var(--bg2);
  color:var(--tx);
  width:clamp(140px,18vw,220px);
  outline:none;
  transition:border-color .15s, width .2s;
}
.global-search-input:focus{
  border-color:#185FA5;
  width:clamp(180px,22vw,280px);
}
.global-search-input::placeholder{color:var(--tx2)}
.global-search-results{
  position:absolute;
  top:calc(100% + 6px);
  left:0;right:0;
  background:var(--bg);
  border:1px solid var(--bd2);
  border-radius:var(--rl);
  box-shadow:0 8px 32px rgba(0,0,0,0.18);
  z-index:1000;
  max-height:320px;
  overflow-y:auto;
  min-width:240px;
}
.gsr-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;
  cursor:pointer;
  border-bottom:1px solid var(--bd);
  gap:12px;
  transition:background .1s;
}
.gsr-item:last-child{border-bottom:none}
.gsr-item:hover{background:var(--bg2)}
.gsr-item-name{font-size:var(--fs-sm);font-weight:500;color:var(--tx)}
.gsr-item-meta{font-size:var(--fs-xs);color:var(--tx2);font-family:var(--mono);text-align:right;flex-shrink:0}
.gsr-item-rank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;font-size:10px;font-weight:700;font-family:var(--mono);background:var(--bg2);color:var(--tx2);flex-shrink:0;margin-right:6px}
.gsr-empty{padding:16px 14px;font-size:var(--fs-sm);color:var(--tx2);text-align:center}
@media(max-width:680px){
}

.bottom-nav{ display:none !important }
}
.bottom-nav{
  display:flex;
  position:fixed;
  bottom:0;left:0;right:0;
  background:var(--bg);
  border-top:1px solid var(--bd);
  z-index:999;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -4px 24px rgba(0,0,0,0.12);
}
.bn-item{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  padding:10px 4px 8px;
  cursor:pointer;
  border:none;
  background:transparent;
  color:var(--tx2);
  font-family:var(--font);
  font-size:10px;
  font-weight:500;
  letter-spacing:0.02em;
  transition:color .15s;
  -webkit-tap-highlight-color:transparent;
}
.bn-item i{
  font-size:22px;
  line-height:1;
  transition:color .15s, transform .15s;
}
.bn-item.active{
  color:var(--tx);
}
.bn-item.active i{
  color:#185FA5;
  transform:translateY(-1px);
}
.bn-item:active i{
  transform:scale(0.9);
}

/* Sortable th */
.player-table th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
.player-table th.sortable:hover{color:var(--tx)}
.sort-icon{display:inline-block;margin-left:4px;opacity:0.4;font-size:10px;vertical-align:1px}
.player-table th.sort-asc .sort-icon::after{content:'↑';opacity:1}
.player-table th.sort-desc .sort-icon::after{content:'↓';opacity:1}
.player-table th.sort-asc .sort-icon,.player-table th.sort-desc .sort-icon{opacity:1;color:var(--tx)}

/* Animated counters */
.metric .val{transition:none}

/* Compare mode */
.compare-bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.compare-bar-label{font-size:var(--fs-xs);color:var(--tx2);width:130px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compare-bar-wrap{flex:1;background:var(--bg2);border-radius:4px;height:10px;overflow:hidden;position:relative}
.compare-bar-a{height:100%;border-radius:4px;position:absolute;left:0;top:0;transition:width .4s}
.compare-bar-b{height:100%;border-radius:4px 0 0 4px;position:absolute;right:0;top:0;transition:width .4s;opacity:0.6}
.compare-vals{font-size:var(--fs-xs);font-family:var(--mono);width:80px;text-align:right;flex-shrink:0}
.compare-select{font-size:var(--fs-sm);font-family:var(--font);padding:8px 12px;border-radius:var(--r);border:1px solid var(--bd2);background:var(--bg2);color:var(--tx);outline:none;min-width:160px;cursor:pointer}
.compare-select:focus{border-color:#185FA5}

const EXCLUDED_PLAYERS = new Map([

// Helper: get all name aliases for a player (current name + any old names)
function getPlayerAliases(playerName){
	var aliases=[playerName];
	EXCLUDED_PLAYERS.forEach(function(canonical, oldName){
		if(canonical.toLowerCase()===playerName.toLowerCase()) aliases.push(oldName);
	});
	return aliases;
}

function findPlayerInArchive(players, playerName){
	if(!players||!players.length) return null;
	var aliases=getPlayerAliases(playerName);
	for(var i=0;i<aliases.length;i++){
		var a=aliases[i];
		var p=players.find(function(x){return x.name===a||x.name.toLowerCase()===a.toLowerCase();});
		if(p) return p;
	}
	return null;
}

function parseGvizResponse(raw){
	const m = raw.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/);
	if(!m) throw new Error('Unexpected response format');
	return JSON.parse(m[1]);
}
function cellStr(c){ return(!c||c.v==null)?'':String(c.v).trim(); }
function cellNum(c){ if(!c||c.v==null)return 0; return typeof c.v==='number'?c.v:parseInt(String(c.v).replace(/[^0-9]/g,''))||0; }

function buildPlayers(table){
	const rows = table.rows;
	const nameIdx = 2, ptsIdx = 3;
	const SKIP = new Set(['Points per chest:','Clan Average per Person','Clan Total:','Name','']);
	const players = [];
	for(let i=6;i<rows.length;i++){
		const row=rows[i]; if(!row||!row.c) continue;
		const name=cellStr(row.c[nameIdx]);
		if(!name||SKIP.has(name)||EXCLUDED_PLAYERS.has(name)) continue;
		const pts=cellNum(row.c[ptsIdx]);
		const chests={};
		CHEST_COLS.forEach(c=>{ chests[c.name]=row.c[c.col]?cellNum(row.c[c.col]):0; });
		PREMIUM_CHEST_COLS.forEach(c=>{ chests[c.name]=row.c[c.col]?cellNum(row.c[c.col]):0; });
		if(pts>0||Object.values(chests).some(v=>v>0)) players.push({name,pts,chests});
	}
	return players;
}

function parseGvizDate(cell){
	// Log timestamps are stored as UTC. Parse to absolute Date, display with local formatters.
	if(!cell || cell.v == null) return null;
	if(typeof cell.v === 'string'){
		const dm = cell.v.match(/Date\((\d+),(\d+),(\d+),(\d+),(\d+),(\d+)\)/);
		if(dm) return new Date(Date.UTC(+dm[1], +dm[2], +dm[3], +dm[4], +dm[5], +dm[6]));
		const d = new Date(cell.v.replace(' ','T')+'Z');
		if(!isNaN(d)) return d;
	}
	if(cell.f){
		const f = String(cell.f).trim();
		const iso = f.match(/^(\d{4})-(\d{1,2})-(\d{1,2})\s+(\d{1,2}):(\d{2}):(\d{2})/);
		if(iso) return new Date(Date.UTC(+iso[1], +iso[2]-1, +iso[3], +iso[4], +iso[5], +iso[6]));
		const md = f.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})/);
		if(md) return new Date(Date.UTC(+md[3], +md[1]-1, +md[2], +md[4], +md[5], +md[6]));
		const d = new Date(f.replace(' ','T')+'Z');
		if(!isNaN(d)) return d;
	}
	return null;
}

function localDateKey(d){
	return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function getLatestLogChestTs(){
	if(!logEvents.length) return null;
	return logEvents.reduce(function(latest,e){ return e.ts>latest?e.ts:latest; }, logEvents[0].ts);
}

function formatLogTime(d){
	return d.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

function parseLogEvents(table){
	const rows = table.rows;
	const events = [];
	// Confirmed column layout from debug:
	// col 1 = OCR Name, col 2 = OCR type, col 4 = Time collected (raw), col 5 = Calculated Time
	// col 6 = NAME (clean), col 7 = TYPE (clean)
	// Use col 5 (Calculated Time) as timestamp — it's the validated one
	// Fall back to col 4 (Time collected) if col 5 is missing
	const SKIP = new Set(['---','','NAME','TYPE','OCR Name','OCR type']);
	for(let i=0; i<rows.length; i++){
		const row = rows[i];
		if(!row || !row.c) continue;
		const nameCell = row.c[6];
		const typeCell = row.c[7];
		if(!nameCell||!nameCell.v||!typeCell||!typeCell.v) continue;
		const name = String(nameCell.v).trim();
		const type = String(typeCell.v).trim();
		if(SKIP.has(name)||SKIP.has(type)) continue;
		// Try col 5 (Calculated Time) first, fall back to col 4 (Time collected)
		let ts = parseGvizDate(row.c[5]);
		if(!ts) ts = parseGvizDate(row.c[4]);
		if(!ts || isNaN(ts)) continue;
		const pts = LOG_TYPE_PTS[type] || 0;
		events.push({ts, name, type, pts});
	}
	events.sort((a,b) => a.ts - b.ts);
	return events;
}

// ── Smart auto-refresh (aligned to hourly chest batches) ──────────
function clampRefreshDelay(ms){
	return Math.max(REFRESH_MIN_MS, Math.min(REFRESH_MAX_MS, ms));
}

function computeSmartRefreshDelay(){
	const lastChest=getLatestLogChestTs();
	const now=Date.now();
	if(!lastChest) return clampRefreshDelay(REFRESH_RETRY_MS);
	if(prevLastChestTs && lastChest.getTime()<=prevLastChestTs.getTime()){
		return clampRefreshDelay(REFRESH_RETRY_MS);
	}
	var delay=lastChest.getTime()+REFRESH_OFFSET_MS-now;
	if(delay<=0) return clampRefreshDelay(REFRESH_RETRY_MS);
	return clampRefreshDelay(delay);
}

function scheduleSmartRefresh(){
	clearInterval(countdownTimer);
	var delay=computeSmartRefreshDelay();
	prevLastChestTs=getLatestLogChestTs();
	nextRefreshAt=Date.now()+delay;
	updateCountdown();
	countdownTimer=setInterval(function(){
		updateCountdown();
		if(Date.now()>=nextRefreshAt){
			clearInterval(countdownTimer);
			loadData(true);
		}
	},1000);
}

function updateCountdown(){
	const el=document.getElementById('countdown');
	const unit=document.getElementById('countdown-unit');
	const badge=document.getElementById('auto-badge');
	if(!el||!nextRefreshAt) return;
	const secsLeft=Math.max(0, Math.ceil((nextRefreshAt-Date.now())/1000));
	if(badge){
		badge.title='Click to refresh now · Next auto-refresh '+new Date(nextRefreshAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
	}
	if(secsLeft>=60){
		el.textContent=Math.ceil(secsLeft/60);
		if(unit) unit.textContent='m';
	}else{
		el.textContent=secsLeft;
		if(unit) unit.textContent='s';
	}
}

function manualRefresh(){
	clearInterval(countdownTimer);
	loadData(false);
}

// ── Participation & streak helpers ───────────────────────────────
function getParticipationStats(){
	const now = Date.now();
	const windows = {h24: 24*3600*1000, h48: 48*3600*1000, d7: 7*24*3600*1000};
	// Get unique players active in each window from log
	const active24 = new Set(logEvents.filter(e=>now-e.ts<=windows.h24).map(e=>e.name));
	const active48 = new Set(logEvents.filter(e=>now-e.ts<=windows.h48).map(e=>e.name));
	const active7d  = new Set(logEvents.filter(e=>now-e.ts<=windows.d7).map(e=>e.name));
	const total = allPlayers.length;
	return {
		active24: active24.size, active48: active48.size, active7d: active7d.size,
		pct24: Math.round(active24.size/total*100),
		pct48: Math.round(active48.size/total*100),
		pct7d:  Math.round(active7d.size/total*100),
		total,
		active24set: active24, active48set: active48, active7dset: active7d
	};
}

function getPlayerStreaks(){
	if(!logEvents.length) return {streaks:[], inactive:[]};
	const now = new Date();
	// For each player, find their last activity timestamp and daily activity buckets
	const playerDays = {};
	logEvents.forEach(e=>{
		const day = localDateKey(e.ts);
		if(!playerDays[e.name]) playerDays[e.name]={days:new Set(),lastSeen:e.ts};
		playerDays[e.name].days.add(day);
		if(e.ts > playerDays[e.name].lastSeen) playerDays[e.name].lastSeen = e.ts;
	});

	// Compute consecutive day streak (working backwards from today)
	const streaks = allPlayers.map(p=>{
		const data = playerDays[p.name];
		if(!data) return {name:p.name, streak:0, lastSeen:null, hoursAgo:null};
		// Count consecutive days ending today or yesterday
		let streak = 0;
		const d = new Date(now);
		for(let i=0; i<28; i++){
			const dayStr = localDateKey(d);
			if(data.days.has(dayStr)) streak++;
			else if(i>0) break; // gap — stop counting
			d.setDate(d.getDate()-1);
		}
		const hoursAgo = Math.round((now-data.lastSeen)/3600000);
		return {name:p.name, streak, lastSeen:data.lastSeen, hoursAgo, pts:p.pts};
	});

	// Hot streaks: active today AND streak >= 2 days
	const hotStreaks = streaks
		.filter(s=>s.streak>=2)
		.sort((a,b)=>b.streak-a.streak)
		.slice(0,10);

	// Inactive: players in allPlayers with no log activity in last 48h
	const inactive = streaks
		.filter(s=>s.hoursAgo===null||s.hoursAgo>48)
		.sort((a,b)=>{
			// null (never seen) first, then by hours desc
			if(a.hoursAgo===null&&b.hoursAgo===null) return b.pts-a.pts;
			if(a.hoursAgo===null) return -1;
			if(b.hoursAgo===null) return 1;
			return b.hoursAgo-a.hoursAgo;
		})
		.slice(0,10);

	return {hotStreaks, inactive, allStreaks:streaks};
}

			<div class="metric"><div class="label">Last 7d</div><div class="val" id="act-7d">—</div><div class="sub">chests logged</div></div>
		</div>
		<div class="card">
			<h3>Clan activity — chests per hour (last 24h)</h3>
			<div id="ec-act-hourly" class="ec-chart" style="height:clamp(180px,22vw,260px)"></div>
		</div>
		<div class="charts-row">
			<div class="card" style="margin-bottom:0">
				<h3>Top earners — last 24h</h3>
				<div id="ec-act-top24" class="ec-chart" style="height:clamp(200px,24vw,300px)"></div>
			</div>
			<div class="card" style="margin-bottom:0">
				<h3>Top earners — last 7 days</h3>
				<div id="ec-act-top7d" class="ec-chart" style="height:clamp(200px,24vw,300px)"></div>
			</div>
		</div>

			<div class="card" style="margin-bottom:0">
				<div id="act-streaks"></div>
			</div>
			<div class="card" style="margin-bottom:0">
				<div id="act-inactive"></div>
			</div>
		</div>
		`;

	requestAnimationFrame(()=>{
		const events24h = getLogWindow(24);
		const events7d  = getLogWindow(24*7);

		// Update metric counters — guard against null in case DOM not ready
		const el24h = document.getElementById('act-24h');
		const el7d  = document.getElementById('act-7d');
		const elPart = document.getElementById('act-part');
		if(el24h) el24h.textContent = events24h.length.toLocaleString();
		if(el7d)  el7d.textContent  = events7d.length.toLocaleString();

		// Participation
		const part = getParticipationStats();
		if(elPart) elPart.textContent = part.active24+'/'+part.total;

		// Streaks panel
		const {hotStreaks, inactive} = getPlayerStreaks();
		const streakEl = document.getElementById('act-streaks');
		if(streakEl){
			if(hotStreaks.length){
				const rows = hotStreaks.map(s=>{
					const pts24 = getPtsLast24h(s.name);
					const esc = s.name.replace(/'/g,"\\'");
					return '<li>'
						+'<span class="sname" onclick="openProfileFromContest(\''+esc+'\')">'+s.name+'</span>'
						+'<div style="display:flex;align-items:center;gap:6px;flex-shrink:0">'
						+(pts24>0?'<span style="font-size:var(--fs-xs);font-family:var(--mono);color:#2d5a0e">+'+pts24.toLocaleString()+'</span>':'')
						+'<span class="status-pill pill-streak">'+s.streak+'d streak</span>'
						+'</div></li>';
				}).join('');
				streakEl.innerHTML = '<div class="overview-section-title">🔥 Hot streaks</div><ul class="status-list">'+rows+'</ul>';
			} else {
				streakEl.innerHTML = '<div class="overview-section-title">🔥 Hot streaks</div><div style="color:var(--tx2);font-size:var(--fs-sm);padding:8px 0">No multi-day streaks yet</div>';
			}
		}

		// Inactive panel
		const inactiveEl = document.getElementById('act-inactive');
		if(inactiveEl && inactive.length){
			const rows = inactive.map(s=>{
				const label = s.hoursAgo===null ? 'No activity logged' : s.hoursAgo<72 ? s.hoursAgo+'h ago' : Math.floor(s.hoursAgo/24)+'d ago';
				const pillCls = s.hoursAgo===null||s.hoursAgo>96 ? 'pill-inactive' : 'pill-idle';
				const esc = s.name.replace(/'/g,"\\'");
				return '<li><span class="sname" onclick="openProfileFromContest(\''+esc+'\')">'+s.name+'</span>'
					+'<span class="status-pill '+pillCls+'">'+label+'</span></li>';
			}).join('');
			inactiveEl.innerHTML = '<div class="overview-section-title">😴 Inactive 48h+</div><ul class="status-list">'+rows+'</ul>';
		}

		// Hourly activity chart (last 24h)
		const now = new Date();
		const hourLabels = [];
		const hourCounts = [];
		for(let h=23; h>=0; h--){
			const start = new Date(now - h*3600000);
			const end   = new Date(now - (h-1)*3600000);
			const label = start.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
			hourLabels.push(label);
			hourCounts.push(logEvents.filter(e=>e.ts>=start&&e.ts<end).length);
		}
		const ch = getOrCreateChart('ec-act-hourly');
		if(ch) ch.setOption({
			backgroundColor:CHART_BG,
			tooltip:{...TOOLTIP_STYLE(),trigger:'axis',axisPointer:{type:'shadow'},formatter:p=>`${p[0].name}<br/><b>${p[0].value}</b> chests`},
			grid:{left:8,right:16,top:8,bottom:50,containLabel:true},
			xAxis:{type:'category',data:hourLabels,axisLabel:{color:EC_TEXT(),fontSize:ecFs(9),rotate:45,interval:2},splitLine:{show:false},axisLine:{lineStyle:{color:EC_SPLIT()}}},
			yAxis:{type:'value',minInterval:1,axisLabel:{color:EC_TEXT(),fontSize:ecFs(10)},splitLine:{lineStyle:{color:EC_SPLIT()}}},
			series:[{type:'bar',data:hourCounts.map(v=>({value:v,itemStyle:{color:'#185FA5',borderRadius:[3,3,0,0]}})),emphasis:{itemStyle:{opacity:0.8}}}]
		});

		// Top earners last 24h (by points)
		const pts24 = {};
		events24h.forEach(e=>{ pts24[e.name]=(pts24[e.name]||0)+e.pts; });
		const top24 = Object.entries(pts24).sort((a,b)=>b[1]-a[1]).slice(0,10);
		const c24 = getOrCreateChart('ec-act-top24');
		if(c24 && top24.length) c24.setOption({
			backgroundColor:CHART_BG,
			tooltip:{...TOOLTIP_STYLE(),trigger:'axis',axisPointer:{type:'shadow'},formatter:p=>`<b>${p[0].name}</b><br/>${p[0].value.toLocaleString()} pts`},
			grid:{left:8,right:16,top:8,bottom:70,containLabel:true},
			xAxis:{type:'category',data:top24.map(x=>x[0]),axisLabel:{color:EC_TEXT(),fontSize:ecFs(10),rotate:35,interval:0},splitLine:{show:false}},
			yAxis:{type:'value',axisLabel:{color:EC_TEXT(),fontSize:ecFs(10),formatter:v=>v>=1000?(v/1000).toFixed(0)+'k':v},splitLine:{lineStyle:{color:EC_SPLIT()}}},
			series:[{type:'bar',data:top24.map((x,i)=>({value:x[1],itemStyle:{color:i===0?'#FAC775':i===1?'#D3D1C7':i===2?'#F5C4B3':'#1D9E75',borderRadius:[4,4,0,0]}})),emphasis:{itemStyle:{opacity:0.8}}}]
		});
		else if(c24) c24.setOption({backgroundColor:CHART_BG,graphic:[{type:'text',left:'center',top:'middle',style:{text:'No activity in last 24h',fill:EC_TEXT(),fontSize:ecFs(14)}}]});

		// Top earners last 7d
		const pts7d = {};
		events7d.forEach(e=>{ pts7d[e.name]=(pts7d[e.name]||0)+e.pts; });
		const top7d = Object.entries(pts7d).sort((a,b)=>b[1]-a[1]).slice(0,10);
		const c7d = getOrCreateChart('ec-act-top7d');
		if(c7d && top7d.length) c7d.setOption({
			backgroundColor:CHART_BG,
			tooltip:{...TOOLTIP_STYLE(),trigger:'axis',axisPointer:{type:'shadow'},formatter:p=>`<b>${p[0].name}</b><br/>${p[0].value.toLocaleString()} pts`},
			grid:{left:8,right:16,top:8,bottom:70,containLabel:true},
			xAxis:{type:'category',data:top7d.map(x=>x[0]),axisLabel:{color:EC_TEXT(),fontSize:ecFs(10),rotate:35,interval:0},splitLine:{show:false}},
			yAxis:{type:'value',axisLabel:{color:EC_TEXT(),fontSize:ecFs(10),formatter:v=>v>=1000?(v/1000).toFixed(0)+'k':v},splitLine:{lineStyle:{color:EC_SPLIT()}}},
			series:[{type:'bar',data:top7d.map((x,i)=>({value:x[1],itemStyle:{color:i===0?'#FAC775':i===1?'#D3D1C7':i===2?'#F5C4B3':'#D4537E',borderRadius:[4,4,0,0]}})),emphasis:{itemStyle:{opacity:0.8}}}]
		});
		else if(c7d) c7d.setOption({backgroundColor:CHART_BG,graphic:[{type:'text',left:'center',top:'middle',style:{text:'No activity in last 7 days',fill:EC_TEXT(),fontSize:ecFs(14)}}]});

	});
}

function renderCompare(){

	const defB=sorted[1]?.name||'';
	document.getElementById('tab-compare').innerHTML=`
		<div class="card">
			<div class="compare-header">
				<span style="font-size:var(--fs-sm);font-weight:600;color:var(--tx2)">Compare</span>
				<div class="compare-player-label"><span class="compare-dot" style="background:#185FA5"></span>
					<select class="compare-select" id="cmp-a" onchange="updateCompare()">
						<option value="">Select player A…</option>${opts}
					</select>
				</div>
				<span style="color:var(--tx2);font-size:var(--fs-sm)">vs</span>
				<div class="compare-player-label"><span class="compare-dot" style="background:#D4537E"></span>
					<select class="compare-select" id="cmp-b" onchange="updateCompare()">
						<option value="">Select player B…</option>${opts}
					</select>
				</div>
			</div>
			<div id="cmp-body" style="color:var(--tx2);font-size:var(--fs-sm);padding:20px 0;text-align:center">Select two players above to compare</div>
		</div>
		<div class="charts-row" id="cmp-charts" style="display:none">
			<div class="card" style="margin-bottom:0"><h3>Score breakdown by category</h3><div id="ec-cmp-radar" class="ec-chart" style="height:clamp(240px,30vw,340px)"></div></div>
			<div class="card" style="margin-bottom:0"><h3>Points distribution</h3><div id="ec-cmp-bar" class="ec-chart" style="height:clamp(240px,30vw,340px)"></div></div>
		</div>`;
	// Pre-select defaults
	if(defA) document.getElementById('cmp-a').value=defA;

function updateCompare(){
	const nameA=document.getElementById('cmp-a')?.value;
	const nameB=document.getElementById('cmp-b')?.value;
	if(!nameA||!nameB||nameA===nameB){
		document.getElementById('cmp-body').style.display='block';
		document.getElementById('cmp-body').textContent=nameA===nameB?'Select two different players':'Select two players above to compare';
		document.getElementById('cmp-charts').style.display='none';
		return;
	}
	const pA=allPlayers.find(p=>p.name===nameA);
	const pB=allPlayers.find(p=>p.name===nameB);
	if(!pA||!pB) return;

	const sortedAll=allPlayers.slice().sort((a,b)=>b.pts-a.pts);
	const avg=Math.round(allPlayers.reduce((s,p)=>s+p.pts,0)/allPlayers.length);
	const rankA=sortedAll.findIndex(p=>p.name===nameA)+1;
	const rankB=sortedAll.findIndex(p=>p.name===nameB)+1;
	const epicA=epicScore(pA), epicB=epicScore(pB);

	// Summary row
	const statRows=[
		{label:'Total points', a:pA.pts, b:pB.pts},
		{label:'Rank', a:rankA, b:rankB, lowerBetter:true},
		{label:'vs clan avg', a:pA.pts-avg, b:pB.pts-avg},
		{label:'Epic Monster chests', a:epicA, b:epicB},
		...GROUP_NAMES.map(g=>({
			label:g,
			a:CHEST_COLS.filter(c=>c.group===g).reduce((s,c)=>s+(pA.chests[c.name]||0)*c.pts,0),
			b:CHEST_COLS.filter(c=>c.group===g).reduce((s,c)=>s+(pB.chests[c.name]||0)*c.pts,0)
		}))
	];

	const barRows=statRows.map(r=>{
		const max=Math.max(Math.abs(r.a),Math.abs(r.b),1);
		const wA=Math.round(Math.abs(r.a)/max*100);
		const wB=Math.round(Math.abs(r.b)/max*100);
		const aWin=r.lowerBetter?r.a<r.b:r.a>r.b;
		const bWin=r.lowerBetter?r.b<r.a:r.b>r.a;
		const fmtA=typeof r.a==='number'&&r.a>999?r.a.toLocaleString():r.a;
		const fmtB=typeof r.b==='number'&&r.b>999?r.b.toLocaleString():r.b;
		return`<div class="compare-bar">
			<span class="compare-bar-label">${r.label}</span>
			<div class="compare-bar-wrap">
				<div class="compare-bar-a" style="width:${wA}%;background:${aWin?'#185FA5':'rgba(24,95,165,0.35)'}"></div>
				<div class="compare-bar-b" style="width:${wB}%;background:${bWin?'#D4537E':'rgba(212,83,126,0.35)'}"></div>
			</div>
			<span class="compare-vals" style="color:#185FA5">${fmtA}</span>
			<span class="compare-vals" style="color:#D4537E">${fmtB}</span>
		</div>`;
	}).join('');

	document.getElementById('cmp-body').style.display='none';
	document.getElementById('cmp-charts').style.display='grid';

	// First insert stat bars into card above charts
	const card=document.querySelector('#tab-compare .card');
	let existing=document.getElementById('cmp-stat-bars');
	if(!existing){existing=document.createElement('div');existing.id='cmp-stat-bars';card.appendChild(existing);}
	existing.innerHTML=barRows;

	// Radar chart
	requestAnimationFrame(()=>{
		const groupPtsA=GROUP_NAMES.map(g=>CHEST_COLS.filter(c=>c.group===g).reduce((s,c)=>s+(pA.chests[c.name]||0)*c.pts,0));
		const groupPtsB=GROUP_NAMES.map(g=>CHEST_COLS.filter(c=>c.group===g).reduce((s,c)=>s+(pB.chests[c.name]||0)*c.pts,0));
		const maxG=GROUP_NAMES.map((_,i)=>Math.max(groupPtsA[i],groupPtsB[i],1));

		const cr=getOrCreateChart('ec-cmp-radar');
		if(cr) cr.setOption({
			backgroundColor:CHART_BG,
			tooltip:{...TOOLTIP_STYLE(),trigger:'item'},
			legend:{bottom:0,textStyle:{color:EC_TEXT(),fontSize:ecFs(11),fontFamily:'DM Sans'},itemWidth:10,itemHeight:10},
			radar:{indicator:GROUP_NAMES.map((n,i)=>({name:n,max:maxG[i]*1.2})),splitLine:{lineStyle:{color:EC_SPLIT()}},splitArea:{show:false},axisName:{color:EC_TEXT(),fontSize:ecFs(10)},axisLine:{lineStyle:{color:EC_SPLIT()}}},
			series:[{type:'radar',data:[
				{name:nameA,value:groupPtsA,areaStyle:{color:'rgba(24,95,165,0.2)'},lineStyle:{color:'#185FA5',width:2},symbol:'circle',symbolSize:5,itemStyle:{color:'#185FA5'}},
				{name:nameB,value:groupPtsB,areaStyle:{color:'rgba(212,83,126,0.2)'},lineStyle:{color:'#D4537E',width:2},symbol:'circle',symbolSize:5,itemStyle:{color:'#D4537E'}}
			]}]
		});

		// Side-by-side bar
		const cb=getOrCreateChart('ec-cmp-bar');
		if(cb) cb.setOption({
			backgroundColor:CHART_BG,
			tooltip:{...TOOLTIP_STYLE(),trigger:'axis',axisPointer:{type:'shadow'}},
			legend:{top:0,textStyle:{color:EC_TEXT(),fontSize:ecFs(11),fontFamily:'DM Sans'},itemWidth:10,itemHeight:10,data:[{name:nameA,itemStyle:{color:'#185FA5'}},{name:nameB,itemStyle:{color:'#D4537E'}}]},
			grid:{left:8,right:8,top:40,bottom:60,containLabel:true},
			xAxis:{type:'category',data:GROUP_NAMES,axisLabel:{color:EC_TEXT(),fontSize:ecFs(10),rotate:25,interval:0},splitLine:{show:false}},
			yAxis:{type:'value',axisLabel:{color:EC_TEXT(),fontSize:ecFs(10),formatter:v=>v>=1000?(v/1000).toFixed(0)+'k':v},splitLine:{lineStyle:{color:EC_SPLIT()}}},
			series:[
				{name:nameA,type:'bar',data:groupPtsA,itemStyle:{color:'#185FA5',borderRadius:[3,3,0,0]},barMaxWidth:28},
				{name:nameB,type:'bar',data:groupPtsB,itemStyle:{color:'#D4537E',borderRadius:[3,3,0,0]},barMaxWidth:28}
			]
		});
	});
}

// ── OVERVIEW ──────────────────────────────────────────────────────
function renderOverview(){
	const sorted=allPlayers.slice().sort((a,b)=>b.pts-a.pts);
	const playerSum=allPlayers.reduce((s,p)=>s+p.pts,0);
	const total=clanTotalPts!=null?clanTotalPts:playerSum;
	const avg=Math.round(total/allPlayers.length);
	const above=allPlayers.filter(p=>p.pts>=avg).length;
	const top10=sorted.slice(0,10);

	const groupTotals=CHEST_GROUPS.map(g=>({
		label:g.label,
		total:allPlayers.reduce((s,p)=>s+g.cols.reduce((ss,c)=>ss+(p.chests[c.name]||0),0),0),
		color:g.color
	})).sort((a,b)=>b.total-a.total);

	// Build dynamic buckets based on actual score range
	const maxScore = Math.max(...allPlayers.map(p=>p.pts));
	const step = maxScore <= 20000 ? 2000 : maxScore <= 50000 ? 5000 : maxScore <= 100000 ? 10000 : 20000;
	const numBuckets = 8;
	const buckets = Array.from({length:numBuckets+1},(_,i)=>i*step);
	buckets[numBuckets] = Infinity;
	const bLabels = Array.from({length:numBuckets},(_,i)=>{
		const lo = i*step, hi = (i+1)*step;
		const fmt = v => v>=1000?(v/1000)+'k':v;
		return i===numBuckets-1 ? fmt(lo)+'+' : fmt(lo)+'–'+fmt(hi);
	});
	const bCounts=bLabels.map((_,i)=>allPlayers.filter(p=>p.pts>=buckets[i]&&p.pts<buckets[i+1]).length);

	document.getElementById('tab-overview').innerHTML=`
		<div class="metrics">
			<div class="metric"><div class="label">Clan total</div><div class="val" id="mc-total">0</div><div class="sub">points this cycle</div></div>
			<div class="metric"><div class="label">Active players</div><div class="val" id="mc-players">0</div><div class="sub">in this sheet</div></div>
			<div class="metric"><div class="label">Average score</div><div class="val" id="mc-avg">0</div><div class="sub">per player</div></div>
			<div class="metric"><div class="label">Above average</div><div class="val" id="mc-above">0</div><div class="sub">${Math.round(above/allPlayers.length*100)}% of players</div></div>
		</div>
		<div class="charts-row">
			<div class="card"><h3>Top 10 players by points</h3><div id="ec-top10" class="ec-chart" style="height:clamp(220px,28vw,320px)"></div></div>
			<div class="card"><h3>Chest category breakdown</h3><div id="ec-donut" class="ec-chart" style="height:clamp(220px,28vw,320px)"></div></div>
		</div>
		<div class="card"><h3>Score distribution — all players</h3><div id="ec-dist" class="ec-chart" style="height:clamp(160px,20vw,240px)"></div></div>`;

	// Animate metric counters
	[['mc-total',total],['mc-players',allPlayers.length],['mc-avg',avg],['mc-above',above]].forEach(([id,target])=>{
		const el=document.getElementById(id); if(!el) return;
		const dur=1000, fps=60, frames=Math.round(dur/(1000/fps));
		let frame=0;
		const tick=()=>{
			frame++;
			const prog=frame/frames;
			const ease=1-Math.pow(1-prog,3); // ease-out cubic
			el.textContent=Math.round(target*ease).toLocaleString();
			if(frame<frames) requestAnimationFrame(tick);
			else el.textContent=target.toLocaleString();
		};
		requestAnimationFrame(tick);
	});

	// Top 10 bar
	requestAnimationFrame(()=>{
		const c1=getOrCreateChart('ec-top10');
		if(c1) c1.setOption({
			backgroundColor:CHART_BG,
			tooltip:{...TOOLTIP_STYLE(),trigger:'axis',axisPointer:{type:'shadow'},formatter:p=>`<b>${p[0].name}</b><br/>${p[0].value.toLocaleString()} pts`},
			grid:{left:8,right:16,top:8,bottom:60,containLabel:true},
			xAxis:{type:'category',data:top10.map(p=>p.name),axisLabel:{color:EC_TEXT(),fontSize:ecFs(11),rotate:30,interval:0},axisLine:{lineStyle:{color:EC_SPLIT()}},splitLine:{show:false}},
			yAxis:{type:'value',axisLabel:{color:EC_TEXT(),fontSize:ecFs(11),formatter:v=>v>=1000?(v/1000).toFixed(0)+'k':v},splitLine:{lineStyle:{color:EC_SPLIT()}}},
			series:[{type:'bar',data:top10.map((p,i)=>({value:p.pts,itemStyle:{color:i===0?'#FAC775':i===1?'#D3D1C7':i===2?'#F5C4B3':'#185FA5',borderRadius:[4,4,0,0]}})),emphasis:{itemStyle:{opacity:0.85}}}]
		});

		// Donut
		const c2=getOrCreateChart('ec-donut');
		if(c2) c2.setOption({
			backgroundColor:CHART_BG,
			tooltip:{...TOOLTIP_STYLE(),trigger:'item',formatter:p=>`${p.name}<br/><b>${p.value.toLocaleString()}</b> chests (${p.percent.toFixed(1)}%)`},
			legend:{orient:'vertical',right:0,top:'middle',textStyle:{color:EC_TEXT(),fontSize:ecFs(11),fontFamily:'DM Sans'},itemWidth:10,itemHeight:10},
			series:[{type:'pie',radius:['42%','72%'],center:['38%','50%'],avoidLabelOverlap:true,
				label:{show:false},
				emphasis:{label:{show:true,fontSize:ecFs(13),fontWeight:600,color:EC_TEXT2()}},
				data:groupTotals.map(g=>({name:g.label,value:g.total,itemStyle:{color:g.color}}))}]
		});

		// Distribution bar
		const c3=getOrCreateChart('ec-dist');
		if(c3) c3.setOption({
			backgroundColor:CHART_BG,
			tooltip:{...TOOLTIP_STYLE(),trigger:'axis',axisPointer:{type:'shadow'},formatter:p=>`${p[0].name}<br/><b>${p[0].value}</b> players`},
			grid:{left:8,right:16,top:8,bottom:40,containLabel:true},
			xAxis:{type:'category',data:bLabels,axisLabel:{color:EC_TEXT(),fontSize:ecFs(11)},axisLine:{lineStyle:{color:EC_SPLIT()}},splitLine:{show:false}},
			yAxis:{type:'value',minInterval:1,axisLabel:{color:EC_TEXT(),fontSize:ecFs(11)},splitLine:{lineStyle:{color:EC_SPLIT()}}},
			series:[{type:'bar',data:bCounts.map(v=>({value:v,itemStyle:{color:'#7F77DD',borderRadius:[4,4,0,0]}})),emphasis:{itemStyle:{opacity:0.8}}}]
		});
	});
}

// ── LEADERBOARD ───────────────────────────────────────────────────
function getSortedPlayers(){
	const byRank=allPlayers.slice().sort((a,b)=>b.pts-a.pts);
	const avg=Math.round(byRank.reduce((s,p)=>s+p.pts,0)/byRank.length);
	const withMeta=byRank.map((p,i)=>({...p,rank:i+1,diff:p.pts-avg,epic:epicScore(p)}));
	const {col,dir}=lbSort;
	const mul=dir==='asc'?1:-1;
	if(col==='rank')  return dir==='asc'?withMeta:withMeta.slice().reverse();
	if(col==='name')  return withMeta.slice().sort((a,b)=>mul*a.name.localeCompare(b.name));
	if(col==='pts')   return withMeta.slice().sort((a,b)=>mul*(a.pts-b.pts));
	if(col==='epic')  return withMeta.slice().sort((a,b)=>mul*(a.epic-b.epic));
	if(col==='diff')  return withMeta.slice().sort((a,b)=>mul*(a.diff-b.diff));
	return withMeta;
}

function setHistSort(col){
	if(histSort.col===col) histSort.dir=histSort.dir==='asc'?'desc':'asc';
	else{histSort.col=col;histSort.dir=col==='name'?'asc':'desc';}
	renderHistory();
}

function parseCycleDays(label,isArchive){
	if(!label) return null;
	var MONTHS={January:0,February:1,March:2,April:3,May:4,June:5,July:6,August:7,September:8,October:9,November:10,December:11};
	// Find all month names in the label (may have 1 or 2 — e.g. "May 25-June 7")
	var monthNames=label.match(/January|February|March|April|May|June|July|August|September|October|November|December/g)||[];
	if(!monthNames.length) return null;
	var startMonth=MONTHS[monthNames[0]];
	var endMonth=monthNames.length>1?MONTHS[monthNames[1]]:startMonth;
	var nums=label.match(/\d+/g)||[];
	var yr=new Date().getFullYear();
	if(isArchive&&nums.length>=2){
		var startDay=parseInt(nums[0]),endDay=parseInt(nums[1]);
		// Build real dates so cross-month spans calculate correctly
		var sy=yr, ey=yr;
		// If end month is before start month, the cycle crossed into next year
		if(endMonth<startMonth) ey=yr+1;
		var startDate=new Date(sy,startMonth,startDay);
		var endDate=new Date(ey,endMonth,endDay);
		var d=Math.round((endDate-startDate)/864e5)+1;
		return d>0?d:null;
	}
	if(!isArchive&&nums.length>=1){
		var st=new Date(yr,startMonth,parseInt(nums[0]));
		if(st>new Date()) st=new Date(yr-1,startMonth,parseInt(nums[0]));
		var diff=Math.max(Math.floor((new Date()-st)/864e5)+1,1);
		return diff;
	}
	return null;
}

function extractSheetMetric(table,label){
	for(var i=0;i<Math.min(table.rows.length,10);i++){
		var row=table.rows[i];if(!row||!row.c)continue;
		if(cellStr(row.c[2])===label) return cellNum(row.c[3]);
	}
	return null;
}

function extractCycleLabel(table){
	var monthRe=/\b(January|February|March|April|May|June|July|August|September|October|November|December)\b/;
	// Scan rows 0-2 for any cell containing a month name
	for(var ri=0;ri<Math.min(3,table.rows.length);ri++){
		var row=table.rows[ri];if(!row||!row.c)continue;
		for(var ci=0;ci<row.c.length;ci++){
			var cell=row.c[ci];
			if(cell&&cell.v&&typeof cell.v==='string'&&monthRe.test(cell.v)){
				return cell.v.trim();
			}
		}
	}
	// Fallback: check table.cols labels
	for(var i=0;i<table.cols.length;i++){
		var lbl=(table.cols[i].label||'').trim();
		if(lbl&&monthRe.test(lbl)){return lbl;}
	}
	return '';
}

// ── CONTEST ───────────────────────────────────────────────────────
function buildRanked(players,scoreFn,asc){
	const sorted=players.slice().sort((a,b)=>asc?scoreFn(a)-scoreFn(b):scoreFn(b)-scoreFn(a));
	let rank=1;
	return sorted.map((p,i)=>{
		if(i>0&&scoreFn(sorted[i])===scoreFn(sorted[i-1])){}else rank=i+1;
		return{rank,name:p.name,score:scoreFn(p)};
	});
}

function contestTable(ranked,n,badgeClass,title){
	const rows=ranked.slice(0,n);
	const lastScore=rows[rows.length-1]?.score;
	const hasTie=ranked.filter(r=>r.score===lastScore).length>1&&ranked.findIndex(r=>r.score===lastScore)<n;
	const trs=rows.map(r=>{
		const rc=r.rank===1?'rank-1':r.rank===2?'rank-2':r.rank===3?'rank-3':'rank-other';
		const esc=r.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
		return`<tr style="cursor:pointer" onclick="openProfileFromContest('${esc}')">
			<td style="width:32px"><span class="rank-badge ${rc}">${r.rank}</span></td>
			<td style="font-weight:500">${r.name} <i class="ti ti-chevron-right" style="font-size:10px;color:var(--tx2)" aria-hidden="true"></i></td>
			<td style="text-align:right;font-weight:500">${r.score.toLocaleString()}</td>
		</tr>`;
	}).join('');
	return`<div class="contest-card">
		<div class="contest-card-header"><span class="title">${title}</span><span class="badge ${badgeClass}">${title.includes('Top')?'Top '+n:'Bottom '+n}</span></div>
		<table class="contest-table"><thead><tr><th style="width:32px">#</th><th>Player</th><th style="text-align:right">Score</th></tr></thead><tbody>${trs}</tbody></table>
		${hasTie?`<div class="tied-note">* Tied at rank ${rows[rows.length-1].rank}</div>`:''}
	</div>`;
}

function renderContest(){
	const oTop=buildRanked(allPlayers,p=>p.pts,false);
	const oBot=buildRanked(allPlayers,p=>p.pts,true);
	const eTop=buildRanked(allPlayers,p=>epicScore(p),false);
	const eBot=buildRanked(allPlayers,p=>epicScore(p),true);
	document.getElementById('tab-contest').innerHTML=`
		<div class="contest-notice"><i class="ti ti-info-circle" style="vertical-align:-2px;margin-right:5px" aria-hidden="true"></i>Refreshes after each hourly chest batch — or hit Refresh now.</div>
		<div class="contest-grid">
			${contestTable(oTop,20,'badge-top','Overall Score — Top 20')}
			${contestTable(oBot,20,'badge-bot','Overall Score — Bottom 20')}
			${contestTable(eTop,20,'badge-epic badge-top','Epic Monster — Top 20')}
			${contestTable(eBot,20,'badge-epic badge-bot','Epic Monster — Bottom 20')}
		</div>`;
}

	if(!p) return;

	const sorted=allPlayers.slice().sort((a,b)=>b.pts-a.pts);

	const total=allPlayers.reduce((s,x)=>s+x.pts,0);
	const avg=Math.round(total/allPlayers.length);
	const pctile=Math.round((1-(rank-1)/allPlayers.length)*100);
	const epicPts=epicScore(p);
	const epicRank=allPlayers.slice().sort((a,b)=>epicScore(b)-epicScore(a)).findIndex(x=>x.name===playerName)+1;
	// Daily pace — always vs most recent completed archive (allArchives[0]), not History tab selection
	const cDays=(currentCycleDays&&currentCycleDays>0)?currentCycleDays:null;
	const lastArchive=allArchives.length?allArchives[0]:null;
	const pDays=(lastArchive&&lastArchive.days>0)?lastArchive.days:null;

				{name:'This player',value:playerGroupPts,areaStyle:{color:'rgba(24,95,165,0.15)'},lineStyle:{color:'#185FA5',width:2},symbol:'circle',symbolSize:5,itemStyle:{color:'#185FA5'}},
				{name:'Clan avg',value:avgGroupPts,areaStyle:{color:'rgba(127,119,221,0.08)'},lineStyle:{color:'#7F77DD',width:1.5,type:'dashed'},symbol:'circle',symbolSize:4,itemStyle:{color:'#7F77DD'}}
			]}]
		});

		// Pie
		const cp=getOrCreateChart('ec-pie');
		if(cp&&groupBreakdown.length) cp.setOption({
			backgroundColor:CHART_BG,
			tooltip:{...TOOLTIP_STYLE(),trigger:'item',formatter:p=>`${p.name}<br/><b>${p.value.toLocaleString()}</b> pts (${p.percent.toFixed(1)}%)`},
			legend:{orient:'vertical',right:0,top:'middle',textStyle:{color:EC_TEXT(),fontSize:ecFs(11),fontFamily:'DM Sans'},itemWidth:10,itemHeight:10},
			series:[{type:'pie',radius:['40%','70%'],center:['38%','50%'],
				label:{show:false},
				emphasis:{label:{show:true,fontSize:ecFs(13),fontWeight:600,color:EC_TEXT2()}},
				data:groupBreakdown.map(x=>({name:x.g,value:x.groupPts,itemStyle:{color:x.color}}))}]
		});
		// Trend chart
		renderProfileTrend(playerName, 24);
		// Cross-cycle performance chart
		renderProfileCycles(playerName);
	});
}

function renderProfileCycles(playerName){
	var el=document.getElementById('ec-profile-cycles');
	if(!el) return;
	var card=document.getElementById('profile-cycles-card');

	// Helper: find a player's pts in a given player list (case-insensitive for renames)
	function findPts(players,name){
		var exact=players.find(function(x){return x.name===name;});
		if(exact) return exact.pts;
		var ci=players.find(function(x){return x.name.toLowerCase()===name.toLowerCase();});
		return ci?ci.pts:null;
	}

	// Build chronological series: oldest archive → ... → current
	// allArchives is newest-first, so reverse for chronological order
	var points=[];
	var archivesChrono=allArchives.slice().reverse();
	archivesChrono.forEach(function(a){
		var pts=findPts(a.players,playerName);
		if(pts!==null){
			points.push({label:a.label, total:pts, days:a.days, pace:(a.days&&a.days>0)?Math.round(pts/a.days):null});
		}
	});
	// Current cycle
	var curPts=findPts(allPlayers,playerName);
	if(curPts!==null){
		var cd=(currentCycleDays&&currentCycleDays>0)?currentCycleDays:null;
		points.push({label:(currentCycleLabel||'Current').replace(/-\s*$/,'')+' (now)', total:curPts, days:cd, pace:cd?Math.round(curPts/cd):null});
	}

	// Need at least 2 data points to be meaningful
	if(points.length<2){
		if(card) card.style.display='none';
		return;
	}
	if(card) card.style.display='';

	var isPace=profileCycleMetric==='pace';
	var vals=points.map(function(p){return isPace?(p.pace||0):p.total;});
	var labels=points.map(function(p){return p.label;});
	var barColor=isPace?'#7F77DD':'#185FA5';

	var ch=getOrCreateChart('ec-profile-cycles');
	if(ch) ch.setOption({
		backgroundColor:CHART_BG,
		tooltip:Object.assign({},TOOLTIP_STYLE(),{trigger:'axis',axisPointer:{type:'shadow'},formatter:function(ps){
			var i=ps[0].dataIndex,pt=points[i];
			var s='<b>'+pt.label+'</b><br/>';
			s+='Total: '+pt.total.toLocaleString()+' pts<br/>';
			s+='Per day: '+(pt.pace!==null?pt.pace.toLocaleString()+' pts/day':'—');
			if(pt.days) s+='<br/><span style="opacity:0.7">'+pt.days+' days</span>';
			return s;
		}}),
		grid:{left:8,right:16,top:16,bottom:48,containLabel:true},
		xAxis:{type:'category',data:labels,axisLabel:{color:EC_TEXT(),fontSize:ecFs(10),rotate:labels.length>4?25:0,interval:0},axisLine:{lineStyle:{color:EC_SPLIT()}}},
		yAxis:{type:'value',axisLabel:{color:EC_TEXT(),fontSize:ecFs(10),formatter:function(v){return v>=1000?(v/1000).toFixed(0)+'k':v;}},splitLine:{lineStyle:{color:EC_SPLIT()}}},
		series:[{type:'bar',data:vals,barMaxWidth:48,
			itemStyle:{color:barColor,borderRadius:[5,5,0,0]},
			label:{show:true,position:'top',color:EC_TEXT2(),fontSize:ecFs(10),fontFamily:'DM Sans',formatter:function(d){return d.value>=1000?(d.value/1000).toFixed(1)+'k':d.value;}}
		}]
	});
}

function renderProfileTrend(playerName, hours){
	const cutoff = new Date(Date.now() - hours*3600000);
		var _aliases=getPlayerAliases(playerName);
	const playerLog = logEvents.filter(e=>_aliases.indexOf(e.name)>=0 && e.ts>=cutoff);

	if(!playerLog.length){
		const ct=getOrCreateChart('ec-profile-trend');
		if(ct) ct.setOption({backgroundColor:CHART_BG,graphic:[{type:'text',left:'center',top:'middle',style:{text:'No log data for this window',fill:EC_TEXT(),fontSize:ecFs(13)}}]});
		return;
	}

	// 24h view → hourly buckets; 7d view → daily buckets
	const byDay = hours>24;
	const buckets={};
	playerLog.forEach(e=>{
		var bucketTime;
		if(byDay){
			// Bucket by calendar day (local midnight)
			bucketTime=new Date(e.ts.getFullYear(),e.ts.getMonth(),e.ts.getDate());
		}else{
			var d=new Date(e.ts);
			bucketTime=new Date(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours());
		}
		const key=bucketTime.toISOString();
		if(!buckets[key]) buckets[key]={ts:bucketTime,pts:0,count:0};
		buckets[key].pts+=e.pts;
		buckets[key].count++;
	});
	const bucketArr=Object.values(buckets).sort((a,b)=>a.ts-b.ts);
	const labels=bucketArr.map(b=>byDay
		? b.ts.toLocaleDateString([],{month:'short',day:'numeric'})
		: b.ts.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
	const values=bucketArr.map(b=>b.pts);

	const ct=getOrCreateChart('ec-profile-trend');
	if(ct) ct.setOption({
		backgroundColor:CHART_BG,
		tooltip:{...TOOLTIP_STYLE(),trigger:'axis',formatter:p=>`${p[0].name}<br/><b>+${p[0].value}</b> pts`},
		grid:{left:8,right:16,top:8,bottom:40,containLabel:true},
		xAxis:{type:'category',data:labels,axisLabel:{color:EC_TEXT(),fontSize:ecFs(10),rotate:hours>24?30:0},splitLine:{show:false},axisLine:{lineStyle:{color:EC_SPLIT()}}},
		yAxis:{type:'value',minInterval:1,axisLabel:{color:EC_TEXT(),fontSize:ecFs(10)},splitLine:{lineStyle:{color:EC_SPLIT()}}},
		series:[{type:'line',data:values,smooth:true,symbol:'circle',symbolSize:5,
			itemStyle:{color:'#185FA5'},lineStyle:{color:'#185FA5',width:2},
			areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(24,95,165,0.3)'},{offset:1,color:'rgba(24,95,165,0.02)'}]}}}]
	});

}

function setArchiveCycle(idx){
	if(!allArchives[idx]) return;
	selectedArchiveIdx = idx;
	var a = allArchives[idx];
	archivePlayers = a.players;
	archiveCycleLabel = a.label;
	archiveCycleDays = a.days;
	renderHistory();
}

function renderHistory(){
	var el=document.getElementById('tab-history');
	if(!el) return;
	if(!archivePlayers.length){
		el.innerHTML='<div class="card" style="text-align:center;padding:2.5rem;color:var(--tx2)">Archive data not available.</div>';
		return;
	}
	var curMap={},prevMap={};
	allPlayers.forEach(function(p){curMap[p.name]=p.pts;});
	// Build case-insensitive lookup for archive — so renamed players still match
	var prevMapLower={};
	archivePlayers.forEach(function(p){
		prevMap[p.name]=p.pts;
		prevMapLower[p.name.toLowerCase()]=p.pts;
	});
	// Only use current cycle player names (deduplicates renames)
	var compared=allPlayers.map(function(p){
		var prev=prevMap[p.name]; // exact match first
		if(prev===undefined) prev=prevMapLower[p.name.toLowerCase()]; // fallback case-insensitive
		prev=prev||0;
		return{name:p.name,cur:p.pts,prev:prev,
			delta:p.pts-prev,
			isNew:prev===0,isGone:false};
	});
	var sorted=compared.slice().sort(function(a,b){return b.delta-a.delta;});
	var curTotal=allPlayers.reduce(function(s,p){return s+p.pts;},0);
	var prevTotal=archivePlayers.reduce(function(s,p){return s+p.pts;},0);
	var curAvg=Math.round(curTotal/allPlayers.length);
	var prevAvg=Math.round(prevTotal/archivePlayers.length);
	var newPlayers=compared.filter(function(p){return p.isNew;});
	var mostImproved=sorted[0];
	var totalDelta=curTotal-prevTotal;
	var cLabel=archiveCycleLabel||'last cycle';
	var cDays=(currentCycleDays&&currentCycleDays>0)?currentCycleDays:1;
	var pDays=(archiveCycleDays&&archiveCycleDays>0)?archiveCycleDays:1;

	// Cycle selector (only if more than one archived cycle exists)
	var selectorHtml='';
	if(allArchives.length>1){
		var opts=allArchives.map(function(a,i){
			return'<option value="'+i+'"'+(i===selectedArchiveIdx?' selected':'')+'>'+a.label+'</option>';
		}).join('');
		selectorHtml='<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">'
			+'<span style="font-size:var(--fs-sm);color:var(--tx2)">Compare current cycle against:</span>'
			+'<select onchange="setArchiveCycle(parseInt(this.value))" style="font-family:var(--font);font-size:var(--fs-sm);padding:7px 12px;border-radius:var(--r);border:1px solid var(--bd2);background:var(--bg2);color:var(--tx);cursor:pointer;outline:none">'+opts+'</select>'
			+'</div>';
	}

	// Build metrics HTML
	var mHtml='<div class="metrics">'
		+'<div class="metric"><div class="label">Cycle delta</div>'
		+'<div class="val" style="color:'+(totalDelta>=0?'#2d5a0e':'#922020')+'">'+(totalDelta>=0?'+':'')+Math.round(totalDelta/1000)+'k</div>'
		+'<div class="sub">vs '+cLabel+'</div></div>'
		+'<div class="metric"><div class="label">Avg score</div>'
		+'<div class="val">'+curAvg.toLocaleString()+'</div>'
		+'<div class="sub">was '+prevAvg.toLocaleString()+' · '+cLabel+'</div></div>'
		+'<div class="metric"><div class="label">Days elapsed</div>'
		+'<div class="val">'+(currentCycleDays||'?')+'</div>'
		+'<div class="sub">of '+(archiveCycleDays||'?')+' days last cycle</div></div>'
		+'<div class="metric"><div class="label">Most improved</div>'
		+'<div class="val" style="font-size:var(--fs-lg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(mostImproved?mostImproved.name.split(' ')[0]:'--')+'</div>'
		+'<div class="sub">'+(mostImproved&&mostImproved.delta>=0?'+':'')+((mostImproved&&mostImproved.delta)||0).toLocaleString()+' pts</div></div>'
		+'<div class="metric"><div class="label">New players</div>'
		+'<div class="val">'+newPlayers.length+'</div>'
		+'<div class="sub">not in last cycle</div></div>'
		+'</div>';

	var chartsHtml='<div class="charts-row">'
		+'<div class="card" style="margin-bottom:0"><h3>Top score changes vs last cycle</h3>'
		+'<div id="ec-hist-delta" class="ec-chart" style="height:clamp(260px,32vw,380px)"></div></div>'
		+'<div class="card" style="margin-bottom:0"><h3>Current vs previous — all players</h3>'
		+'<div id="ec-hist-scatter" class="ec-chart" style="height:clamp(260px,32vw,380px)"></div></div>'
		+'</div>';

	var theadHtml='<thead><tr>'
		+'<th style="width:48px">#</th>'
		+'<th class="sortable hist-col-name" onclick="setHistSort(\'name\')" style="cursor:pointer">Player</th>'
		+'<th class="sortable" onclick="setHistSort(\'cur\')" style="text-align:right;cursor:pointer">Current</th>'
		+'<th class="sortable" onclick="setHistSort(\'prev\')" style="text-align:right;cursor:pointer">'+cLabel+'</th>'
		+'<th class="sortable" onclick="setHistSort(\'curPpd\')" style="text-align:right;cursor:pointer">Cur pts/day</th>'
		+'<th class="sortable" onclick="setHistSort(\'prevPpd\')" style="text-align:right;cursor:pointer">Prev pts/day</th>'
		+'<th class="sortable" onclick="setHistSort(\'pace\')" style="text-align:right;cursor:pointer">Daily pace</th>'
		+'<th class="sortable" onclick="setHistSort(\'delta\')" style="text-align:right;cursor:pointer">Change</th>'
		+'<th style="width:80px">Trend</th>'
		+'</tr></thead>';

	var tableHtml='<div class="card" style="margin-top:12px">'
		+'<h3>Full cycle comparison <span style="font-weight:400;color:var(--tx2);font-size:var(--fs-xs)">click headers to sort</span></h3>'
		+'<div class="tbl-scroll"><table class="player-table hist-table">'+theadHtml
		+'<tbody id="hist-tbody"></tbody></table></div></div>';

	el.innerHTML=selectorHtml+mHtml+chartsHtml+tableHtml;

	requestAnimationFrame(function(){
		// Delta bar chart
		var top15=sorted.slice(0,15);
		var bot5=sorted.slice(-5).reverse();
		var combined=top15.concat(bot5.filter(function(p){return top15.indexOf(p)<0;}));
		var ch=getOrCreateChart('ec-hist-delta');
		if(ch) ch.setOption({
			backgroundColor:CHART_BG,
			tooltip:Object.assign({},TOOLTIP_STYLE(),{trigger:'axis',axisPointer:{type:'shadow'},
				formatter:function(p){return'<b>'+p[0].name+'</b><br/>'+(p[0].value>=0?'+':'')+p[0].value.toLocaleString()+' pts';}}),
			grid:{left:8,right:16,top:8,bottom:70,containLabel:true},
			xAxis:{type:'category',data:combined.map(function(p){return p.name.length>12?p.name.slice(0,12)+'…':p.name;}),
				axisLabel:{color:EC_TEXT(),fontSize:ecFs(10),rotate:35,interval:0},splitLine:{show:false}},
			yAxis:{type:'value',axisLabel:{color:EC_TEXT(),fontSize:ecFs(10),
				formatter:function(v){return Math.abs(v)>=1000?(v/1000).toFixed(0)+'k':v;}},
				splitLine:{lineStyle:{color:EC_SPLIT()}}},
			series:[{type:'bar',
				data:combined.map(function(p){return{value:p.delta,itemStyle:{color:p.delta>=0?'#1D9E75':'#E24B4A',borderRadius:p.delta>=0?[4,4,0,0]:[0,0,4,4]}};}),
				markLine:{silent:true,lineStyle:{color:EC_SPLIT(),type:'dashed'},data:[{yAxis:0}]}}]
		});

		// Scatter chart
		var sc=getOrCreateChart('ec-hist-scatter');
		var scData=compared.filter(function(p){return!p.isNew;}).map(function(p){return{value:[p.prev,p.cur],name:p.name};});
		var maxVal=Math.max.apply(null,compared.map(function(p){return Math.max(p.cur,p.prev);}));
		maxVal=Math.max(maxVal,1);
		if(sc) sc.setOption({
			backgroundColor:CHART_BG,
			tooltip:Object.assign({},TOOLTIP_STYLE(),{trigger:'item',
				formatter:function(p){return'<b>'+p.name+'</b><br/>Last: '+p.value[0].toLocaleString()+'<br/>Now: '+p.value[1].toLocaleString();}}),
			grid:{left:8,right:16,top:16,bottom:40,containLabel:true},
			xAxis:{type:'value',name:'Last cycle',nameTextStyle:{color:EC_TEXT(),fontSize:ecFs(10)},
				axisLabel:{color:EC_TEXT(),fontSize:ecFs(9),formatter:function(v){return v>=1000?(v/1000).toFixed(0)+'k':v;}},
				splitLine:{lineStyle:{color:EC_SPLIT()}}},
			yAxis:{type:'value',name:'Current',nameTextStyle:{color:EC_TEXT(),fontSize:ecFs(10)},
				axisLabel:{color:EC_TEXT(),fontSize:ecFs(9),formatter:function(v){return v>=1000?(v/1000).toFixed(0)+'k':v;}},
				splitLine:{lineStyle:{color:EC_SPLIT()}}},
			series:[
				{type:'line',data:[[0,0],[maxVal,maxVal]],lineStyle:{color:EC_SPLIT(),type:'dashed',width:1},symbol:'none',tooltip:{show:false},z:1},
				{type:'scatter',data:scData,symbolSize:7,
					itemStyle:{color:function(p){return p.value[1]>=p.value[0]?'#1D9E75':'#E24B4A';},opacity:0.8},
					emphasis:{scale:1.5}}
			]
		});

		// Table rows
		var tbody=document.getElementById('hist-tbody');
		if(tbody){
			var withPpd=sorted.map(function(p){
				var cp=Math.round(p.cur/cDays);
				var pp=p.prev>0?Math.round(p.prev/pDays):null;
				return Object.assign({},p,{curPpd:cp,prevPpd:pp,pace:pp!==null?cp-pp:null});
			});
			var col=histSort.col,dir=histSort.dir,mul=dir==='asc'?1:-1;
			var rows=withPpd.slice().sort(function(a,b){
				if(col==='name') return mul*a.name.localeCompare(b.name);
				if(col==='cur') return mul*(a.cur-b.cur);
				if(col==='prev') return mul*(a.prev-b.prev);
				if(col==='curPpd') return mul*(a.curPpd-b.curPpd);
				if(col==='prevPpd') return mul*((a.prevPpd||0)-(b.prevPpd||0));
				if(col==='pace') return mul*((a.pace||0)-(b.pace||0));
				if(col==='delta') return mul*(a.delta-b.delta);
				return 0;
			});
			var maxD=Math.max.apply(null,withPpd.map(function(x){return Math.abs(x.delta);}));
			maxD=Math.max(maxD,1);
			tbody.innerHTML=rows.map(function(p,i){
				var sg=p.delta>=0?'+':'';
				var cl=p.delta>=0?'above':'below';
				var bw=Math.round(Math.abs(p.delta)/maxD*100);
				var bc=p.delta>=0?'#1D9E75':'#E24B4A';
				var nt=p.isNew?'<span class="status-pill pill-hot" style="margin-left:6px;font-size:10px">NEW</span>':'';
				var es=p.name.replace(/'/g,"\'");
				var ps=p.pace!==null&&p.pace>=0?'+':'';
				var pc2=p.pace!==null&&p.pace>=0?'above':'below';
				return '<tr class="clickable" onclick="openProfileFromContest(\'' + es + '\')">'
					+'<td style="width:48px;color:var(--tx2);font-family:var(--mono);font-size:var(--fs-xs)">'+(i+1)+'</td>'
					+'<td class="hist-col-name" style="font-weight:500">'+p.name+nt+'</td>'
					+'<td style="text-align:right;font-family:var(--mono)">'+p.cur.toLocaleString()+'</td>'
					+'<td style="text-align:right;font-family:var(--mono);color:var(--tx2)">'+(p.prev>0?p.prev.toLocaleString():'&mdash;')+'</td>'
					+'<td style="text-align:right;font-family:var(--mono);font-weight:500">'+p.curPpd.toLocaleString()+'</td>'
					+'<td style="text-align:right;font-family:var(--mono);color:var(--tx2)">'+(p.prevPpd!==null?p.prevPpd.toLocaleString():'&mdash;')+'</td>'
					+'<td style="text-align:right">'+(p.pace!==null?'<span class="diff-badge '+pc2+'">'+ps+p.pace.toLocaleString()+'</span>':'&mdash;')+'</td>'
					+'<td style="text-align:right"><span class="diff-badge '+cl+'">'+sg+p.delta.toLocaleString()+'</span></td>'
					+'<td><div class="bar-track"><div class="bar-fill" style="width:'+bw+'%;background:'+bc+'"></div></div></td>'
					+'</tr>';
			}).join('');
		}
	});
}


// ── PREMIUM TAB (#premium — hidden, not in nav) ─────────────────
function renderPremium(){
	var el=document.getElementById('tab-premium');
	if(!el) return;

	// Compute premium stats per player
	var players=allPlayers.map(function(p){
		var premPts=PREMIUM_CHEST_COLS.reduce(function(s,c){return s+(p.chests[c.name]||0)*c.pts;},0);
		var premCount=PREMIUM_CHEST_COLS.reduce(function(s,c){return s+(p.chests[c.name]||0);},0);
		var premUsd=PREMIUM_CHEST_COLS.reduce(function(s,c){return s+chestUsd(p.chests[c.name]||0,c.usd);},0);
		return Object.assign({},p,{premPts:premPts,premCount:premCount,premUsd:premUsd});
	}).filter(function(p){return p.premPts>0||p.premCount>0;})
	  .sort(function(a,b){return b.premUsd-a.premUsd;});

	var totals=PREMIUM_CHEST_COLS.map(function(c){
		var total=allPlayers.reduce(function(s,p){return s+(p.chests[c.name]||0);},0);
		return{name:c.name,color:c.color,pts:c.pts,usd:c.usd,total:total,
			totalUsd:chestUsd(total,c.usd)};
	});
	var grandTotal=totals.reduce(function(s,c){return s+c.total;},0);
	var grandPts=totals.reduce(function(s,c){return s+c.total*c.pts;},0);
	var grandUsd=totals.reduce(function(s,c){return s+c.totalUsd;},0);

	// Metric cards
	var mHtml='<div class="metrics">'
		+'<div class="metric"><div class="label">Premium pts total</div><div class="val">'+grandPts.toLocaleString()+'</div><div class="sub">across all players</div></div>'
		+'<div class="metric"><div class="label">Estimated spend</div><div class="val">'+fmtUsd(grandUsd)+'</div><div class="sub">clan total</div></div>'
		+'<div class="metric"><div class="label">Top spender</div><div class="val" style="font-size:var(--fs-lg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(players[0]?players[0].name.split(' ')[0]:'—')+'</div><div class="sub">'+(players[0]?fmtUsd(players[0].premUsd):'')+'</div></div>'
		+'<div class="metric"><div class="label">Players active</div><div class="val">'+players.length+'</div><div class="sub">with premium chests</div></div>'
		+'</div>';

	// Chest type breakdown bars
	var maxTotal=Math.max.apply(null,totals.map(function(c){return c.total;}));maxTotal=Math.max(maxTotal,1);
	var barsHtml=totals.map(function(c){
		var w=Math.round(c.total/maxTotal*100);
		return'<div class="bar-row">'
			+'<span class="bar-label">'+c.name+'</span>'
			+'<div class="bar-track"><div class="bar-fill" style="width:'+w+'%;background:'+c.color+'"></div></div>'
			+'<span class="bar-val">'+c.total.toLocaleString()+'</span>'
			+'<span style="font-size:var(--fs-xs);color:var(--tx2);margin-left:8px;font-family:var(--mono)">'+fmtUsd(c.totalUsd)+' · '+(c.pts)+' pts ea · '+fmtUsd(c.usd)+'/pack</span>'
			+'</div>';
	}).join('');

	// Player table
	var rowsHtml=players.map(function(p,i){
		var rc=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-other';
		var chestCells=PREMIUM_CHEST_COLS.map(function(c){
			var v=p.chests[c.name]||0;
			return'<td style="text-align:right;font-family:var(--mono)">'+(v>0?v:'&mdash;')+'</td>';
		}).join('');
		var tr=document.createElement('tr');
		tr.className='clickable';
		tr.style.cursor='pointer';
		tr.addEventListener('click',(function(name){return function(){openProfileFromContest(name);};})(p.name));
		tr.innerHTML='<td style="width:36px"><span class="rank-badge '+rc+'">'+(i+1)+'</span></td>'
			+'<td style="font-weight:500">'+p.name+'</td>'
			+chestCells
			+'<td style="text-align:right;font-family:var(--mono);font-weight:500">'+p.premCount.toLocaleString()+'</td>'
			+'<td style="text-align:right;font-family:var(--mono);color:#E24B4A;font-weight:600">'+p.premPts.toLocaleString()+'</td>'
			+'<td style="text-align:right;font-family:var(--mono);color:#2d5a0e;font-weight:600">'+fmtUsd(p.premUsd)+'</td>';
		return tr.outerHTML;
	}).join('');

	var thCells=PREMIUM_CHEST_COLS.map(function(c){
		return'<th style="text-align:right;white-space:nowrap">'+c.name.replace(' Chest','')+'</th>';
	}).join('');

	el.innerHTML=mHtml
		+'<div class="card"><h3>Premium chest type totals</h3>'
		+'<div style="max-width:560px;padding-top:4px">'+barsHtml+'</div></div>'
		+'<div class="card"><h3>Player premium breakdown</h3>'
		+'<div class="tbl-scroll"><table class="player-table">'
		+'<thead><tr><th style="width:36px">#</th><th>Player</th>'+thCells
		+'<th style="text-align:right">Total</th><th style="text-align:right;color:#E24B4A">Pts</th><th style="text-align:right;color:#2d5a0e">Est. $</th></tr></thead>'
		+'<tbody>'+rowsHtml+'</tbody></table></div></div>';
}

function activateTab(name){
	activeTab = name;
	// Update URL hash
	var _hash = name === 'overview' ? window.location.pathname : window.location.pathname + '#' + name;
	if(name === 'leaderboard') {
		var _pp = new URLSearchParams(window.location.search).get('player');
		_hash = window.location.pathname + '#leaderboard' + (_pp ? '?player=' + encodeURIComponent(_pp) : '');
	}
	history.replaceState(null, '', _hash);
	// Show/hide content panels
	['overview','leaderboard','contest','chests','compare','activity','history','premium'].forEach(t=>{
		const el=document.getElementById('tab-'+t);
		if(el) t===name?el.classList.remove('hidden'):el.classList.add('hidden');
	});
	// Sync desktop tabs
	document.querySelectorAll('.tab').forEach((t,i)=>{
		const names=['overview','leaderboard','contest','chests','compare','activity','history','premium'];
		t.classList.toggle('active', names[i]===name);
	});
	// Sync bottom nav
	['overview','leaderboard','contest','chests','compare','activity','history','premium'].forEach(t=>{
		const el=document.getElementById('bn-'+t);
		if(el) el.classList.toggle('active', t===name);
	});
	// Resize charts
	requestAnimationFrame(()=>{
		if(name==='overview') ['ec-top10','ec-donut','ec-dist'].forEach(id=>{if(ecInstances[id])ecInstances[id].resize();});
		if(name==='compare') ['ec-cmp-radar','ec-cmp-bar'].forEach(id=>{if(ecInstances[id])ecInstances[id].resize();});
		if(name==='activity') ['ec-act-hourly','ec-act-top24','ec-act-top7d'].forEach(id=>{if(ecInstances[id])ecInstances[id].resize();});
		if(name==='history') ['ec-hist-delta','ec-hist-scatter'].forEach(id=>{if(ecInstances[id])ecInstances[id].resize();});
		// premium tab — re-render in case data updated
		if(name==='premium') renderPremium();
	});
	// Scroll to top on mobile tab switch
	if(window.innerWidth<=680) window.scrollTo({top:0, behavior:'smooth'});
}

function switchTab(name,btn){
	activateTab(name);
}

function mobileTab(name){
	activateTab(name);
}

// ── PWA Install prompt ───────────────────────────────────────────
var _pwaPrompt = null;

// Inject manifest blob so we don't need a separate file
(function(){
	var manifest = {
		name: 'GoD SK — Spring 2026',
		short_name: 'GoD SK',
		version: '1.3.1', // x-release-please-version
		description: 'GoD SK Clan Analytics Dashboard',
		start_url: window.location.href.split('#')[0],
		display: 'standalone',
		background_color: '#1a1a18',
		theme_color: '#1a1a18',
		orientation: 'portrait-primary',
		icons: [
			{src:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%231a1a18"/><text y=".9em" font-size="80" x="10">⚔️</text></svg>',sizes:'any',type:'image/svg+xml'}
		]
	};
	var blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
	var url  = URL.createObjectURL(blob);
	var link = document.getElementById('pwa-manifest');
	if(link) link.href = url;
})();

window.addEventListener('beforeinstallprompt', function(e){
	e.preventDefault();
	_pwaPrompt = e;
	var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
	if(isStandalone || localStorage.getItem('pwa-dismissed')) return;
	setTimeout(function(){
		if(localStorage.getItem('pwa-dismissed')) return;
		var banner = document.getElementById('pwa-banner');
		if(banner) banner.classList.remove('hidden');
	}, 3000);
});

window.addEventListener('appinstalled', function(){
	localStorage.setItem('pwa-dismissed','1');
	var banner = document.getElementById('pwa-banner');
	if(banner) banner.style.display='none';
	_pwaPrompt = null;
});

function dismissPwaBanner(){
	localStorage.setItem('pwa-dismissed','1');
	var banner = document.getElementById('pwa-banner');
	if(banner) banner.style.display='none';
	_pwaPrompt = null;
}

document.addEventListener('DOMContentLoaded', function(){
	var btn = document.getElementById('pwa-install-btn');
	if(btn) btn.addEventListener('click', function(){
		var banner = document.getElementById('pwa-banner');
		if(banner) banner.style.display='none';
		if(_pwaPrompt){
			var p = _pwaPrompt;
			_pwaPrompt = null;
			p.prompt();
			p.userChoice.then(function(r){
				if(r.outcome==='accepted') localStorage.setItem('pwa-dismissed','1');
			});
		}
	});
});


// Handle browser back/forward navigation
window.addEventListener('popstate', function(){
	var hashTab = window.location.hash.replace('#','').split('?')[0].trim() || 'overview';
	var validTabs = ['overview','leaderboard','contest','chests','compare','activity','history','premium'];
	var tab = validTabs.includes(hashTab) ? hashTab : 'overview';
	activateTab(tab);
});

// Resize all charts on window resize
window.addEventListener('resize',()=>{
	Object.values(ecInstances).forEach(c=>{ try{c.resize();}catch(e){} });
});

// ── URL routing ──────────────────────────────────────────────────
function getUrlPlayer(){ return new URLSearchParams(window.location.search).get('player'); }

function setUrlPlayer(name){
	var base = window.location.pathname + '#leaderboard';
	if(name) history.replaceState(null,'', base + '?player=' + encodeURIComponent(name));
	else history.replaceState(null,'', base);
}

// ── Changelog modal ───────────────────────────────────────────────
function renderChangelogContent(){
	var body=document.getElementById('changelog-body');
	if(!body) return;
	body.innerHTML=CHANGELOG_ENTRIES.map(function(entry){
		var grouped={};
		entry.changes.forEach(function(c){
			if(!grouped[c.type]) grouped[c.type]=[];
			grouped[c.type].push(c.text);
		});
		var sections=Object.keys(grouped).map(function(type){
			return '<div class="changelog-type">'+type+'</div>'
				+'<ul class="changelog-list">'
				+grouped[type].map(function(t){return '<li>'+t+'</li>';}).join('')
				+'</ul>';
		}).join('');
		return '<div class="changelog-entry">'
			+'<div class="changelog-version">'+entry.version+'</div>'
			+'<div class="changelog-date">'+entry.date+'</div>'
			+sections
			+'</div>';
	}).join('');
}

function openChangelog(){
	renderChangelogContent();
	var el=document.getElementById('changelog-backdrop');
	if(el) el.classList.remove('hidden');
	document.body.style.overflow='hidden';
}

function closeChangelog(){
	var el=document.getElementById('changelog-backdrop');
	if(el) el.classList.add('hidden');
	document.body.style.overflow='';
}

document.addEventListener('keydown',function(e){
	if(e.key==='Escape' && document.getElementById('changelog-backdrop') && !document.getElementById('changelog-backdrop').classList.contains('hidden')){
		closeChangelog();
	}
});

// ── Boot ─────────────────────────────────────────────────────────
loadData().then(()=>{
	const _validTabs=['overview','leaderboard','contest','chests','compare','activity','history','premium'];
	const _hashTab=window.location.hash.replace('#','').split('?')[0].trim();
	const _startTab=_validTabs.includes(_hashTab)?_hashTab:'overview';
	const urlPlayer=getUrlPlayer();
	if(urlPlayer){
		const match=allPlayers.find(p=>p.name.toLowerCase()===urlPlayer.toLowerCase());
		if(match){ activateTab('leaderboard'); openProfile(match.name); }
		else if(_startTab!=='overview') activateTab(_startTab);
	} else if(_startTab!=='overview'){
		activateTab(_startTab);
	}
});
